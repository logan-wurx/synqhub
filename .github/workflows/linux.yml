# SYNQ on Linux: every check (npm run verify, the same command as locally), the .deb and AppImage built on
# Ubuntu 22.04 (glibc 2.35, so they run on 22.04 and newer), installed and self-tested, and end-to-end UI tests of
# the real app under Xvfb. Bundles and screenshots are uploaded as artifacts; no GitHub release is ever made.
#
# Runs on pushes to main (and the work branches), on pull requests, and by hand. By hand, each stage can be switched off to save minutes.
name: Linux

on:
  push:
    branches: [main, linux-port, controllers, lighting]
  pull_request:
  workflow_dispatch:
    inputs:
      verify:
        description: "npm run verify (TypeScript, node tests, simulations, Rust tests, builds)"
        type: boolean
        default: true
      bundle:
        description: "Build the .deb and AppImage, install the .deb, run the self-tests"
        type: boolean
        default: true
      e2e:
        description: "End-to-end UI tests (WebdriverIO, tauri-driver, WebKitWebDriver, Xvfb)"
        type: boolean
        default: true

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # The AppImage runtime can run without FUSE.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  linux:
    name: Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: System packages (WebKitGTK 4.1, udev, D-Bus, Xvfb, WebKitWebDriver)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libudev-dev libdbus-1-dev \
            xvfb xauth webkit2gtk-driver libfuse2

      - uses: actions/setup-node@v5
        with:
          # The same Node (and npm) as the development PC, so local and CI checks match.
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache (registry, git, target, installed tools)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-ubuntu-22.04
          cache-bin: "true"
          cache-on-failure: "true"

      # npm install, as on the development PC: package-lock.json keeps every locked version; npm ci refuses this
      # lock because of a bundled wasm-only optional dependency (@tailwindcss/oxide-wasm32-wasi) it never installs.
      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Verify (tsc, node tests, simulations, app and helper Rust tests, desktop and website builds)
        if: github.event_name != 'workflow_dispatch' || inputs.verify
        run: npm run verify

      # ---- the bundles

      - name: Build the .deb and the AppImage
        id: bundle
        if: (github.event_name != 'workflow_dispatch' || inputs.bundle) && !cancelled()
        run: npx tauri build

      - name: Self-test the built app (HID layer, device tables, EQ engine detection; no window)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: xvfb-run -a src-tauri/target/release/synq --self-test | tee self-test.json

      - name: Install the .deb and check what it put in place
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          set -euo pipefail
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          echo "::group::contents"; dpkg-deb -c "$deb"; dpkg-deb -I "$deb"; echo "::endgroup::"
          pkg=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y "./$deb"
          app=$(dpkg -L "$pkg" | grep -E '^/usr/bin/[^/]+$' | grep -v synq-helper | head -n1)
          echo "app: $app"
          test -x /usr/bin/synq-helper
          cmp /usr/lib/udev/rules.d/70-onboard-hub.rules src-tauri/linux/70-onboard-hub.rules
          "$app" --print-udev-rules | cmp - /usr/lib/udev/rules.d/70-onboard-hub.rules
          xvfb-run -a "$app" --self-test > /dev/null
          sudo apt-get remove -y "$pkg"
          test ! -e /usr/lib/udev/rules.d/70-onboard-hub.rules

      - name: Check the AppImage (self-test, the rule it prints, the helper inside)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          set -euo pipefail
          app=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          chmod +x "$app"
          xvfb-run -a "$app" --self-test > /dev/null
          "$app" --print-udev-rules | cmp - src-tauri/linux/70-onboard-hub.rules
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$app" --appimage-extract > /dev/null && test -x squashfs-root/usr/bin/synq-helper)

      - name: Upload the .deb, the AppImage and the self-test report
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: onboard-hub-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            self-test.json
          if-no-files-found: error
          retention-days: 14

      # ---- end-to-end UI tests (the real app with the preview's sample devices)

      - name: Install tauri-driver
        id: driver
        if: (github.event_name != 'workflow_dispatch' || inputs.e2e) && !cancelled()
        run: command -v tauri-driver || cargo install tauri-driver --version 2.0.4 --locked

      - name: Build the app for the end-to-end tests (debug, sample devices)
        id: e2e_build
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        run: npx tauri build --debug --no-bundle --config src-tauri/tauri.e2e.conf.json

      - name: End-to-end tests (WebdriverIO, tauri-driver, WebKitWebDriver, Xvfb)
        if: ${{ !cancelled() && steps.e2e_build.outcome == 'success' }}
        run: |
          npm ci --prefix e2e --no-audit --no-fund
          xvfb-run -a --server-args="-screen 0 1440x960x24" npm --prefix e2e test

      - name: Upload the end-to-end screenshots
        if: always() && steps.e2e_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ github.sha }}
          path: e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14
