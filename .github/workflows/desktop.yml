# The other desktops, by hand only (never on push, so they don't spend minutes on every commit):
#
# - Windows: npm run verify and the NSIS installer (the Windows app is developed and tested locally; this is the
#   clean-machine check). Windows minutes count double.
# - macOS (Apple silicon and Intel): wired and switched off. It runs only when the repository variable
#   MACOS_ENABLED is "true", with an Apple Developer account's signing and notarization secrets set:
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD
#   (an app-specific password) and APPLE_TEAM_ID. macOS minutes count ten times.
#
# Bundles are uploaded as artifacts; no GitHub release is ever made.
name: Desktop (Windows, macOS)

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows: verify and build the NSIS installer"
        type: boolean
        default: true
      macos:
        description: "macOS (needs the repository variable MACOS_ENABLED=true and the Apple secrets)"
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Windows
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The same Node (and npm) as the development PC, so local and CI checks match.
          node-version: 24.13.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows
          cache-on-failure: "true"
      - run: npm install --no-audit --no-fund
      - name: The bundled EQ engine installer (checked against its SHA-256)
        run: node src-tauri/eq-engine/fetch.mjs
      - run: npm run verify
      - name: Build the NSIS installer
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: onboard-hub-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (${{ matrix.target }})
    if: inputs.macos && vars.MACOS_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The same Node (and npm) as the development PC, so local and CI checks match.
          node-version: 24.13.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-${{ matrix.target }}
          cache-on-failure: "true"
      - run: npm install --no-audit --no-fund
      - name: Verify (TypeScript, node tests, simulations, builds)
        run: npm run verify -- --only=tsc,test,sims,build
      - name: Build, sign and notarize (no release)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: onboard-hub-macos-${{ matrix.target }}-${{ github.sha }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
