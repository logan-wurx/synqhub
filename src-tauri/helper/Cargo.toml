[package]
name = "synq-helper"
version = "0.1.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/logan-wurx/synqhub"
homepage = "https://synqhub.app"
authors = ["logan-wurx"]
description = "SYNQ Helper: opt-in background process for game profiles, battery alerts and the web bridge"
edition = "2024"
publish = false

# One small binary (Windows and Linux), no WebView, no Tauri. The bridge and guard code is SYNQ's own
# (src-tauri/src/hid.rs, brands.rs, advanced.rs, eq.rs, engine/), compiled in from the same files.
[[bin]]
name = "synq-helper"
path = "src/main.rs"

[features]
# The website's download (release/tools/build-release.mjs): SYNQ's own program inside the helper, put next to it as
# synq-profiles.exe when it installs itself, so game profiles for every device switch with the site closed
# (src/pass.rs). The copy in the desktop installer leaves it out: the app is beside it there. Needs SYNQ_APP_EXE.
with-app = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6.7"
sha2 = "0.10"
sha1 = "0.10"
# The Wi-Fi lights' message guard (src/lighting/net/guard.rs), for the website through the bridge.
regex = "1"

# Windows: the Run key, named events, the tray icon and Toolhelp (and the EQ engine's code, src/engine).
[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
# The EQ engine's installer check (src/engine/installer.rs) watches its own child process.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  # The Games page's Steam covers, for the website through the bridge (src/library.rs).
  "Win32_System_Com_Urlmon",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Monitors (DDC/CI) and webcams (Media Foundation), for the website through the bridge.
  "Win32_Devices_Display",
  "Win32_System_StationsAndDesktops",
  "Win32_System_WindowsProgramming",
  "Win32_Media_DirectShow",
  "Win32_Media_MediaFoundation",
] }

# Unix: the single-instance lock, SIGTERM, hidraw permission checks.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux: the tray icon (a StatusNotifierItem) and desktop notifications, over one pure-Rust D-Bus stack.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
notify-rust = { version = "4.18.2", default-features = false, features = ["z"] }
